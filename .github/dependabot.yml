version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # golang.org/x/* and friends usually move together.
      go-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The Go version in the Dockerfile's build stage must keep up with the
  # "go" line in go.mod, which gomod updates can raise.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
