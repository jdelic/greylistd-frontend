name: Release

# For version tags (v1.2.3): builds and pushes the container image, and
# publishes static linux/amd64 and linux/arm64 builds (tarballs with the
# systemd unit example, .deb packages, plus SHA256SUMS) as a GitHub release
# for the tag. The builds use the Makefile's dist and deb targets.
#
# Registry configuration — set these as repository (or "release" environment)
# variables and secrets under Settings → Secrets and variables → Actions:
#
#   vars.REGISTRY            registry host, e.g. registry.example.com
#                            (default: ghcr.io)
#   vars.IMAGE_NAME          image path without host, e.g. mail/greylistd-frontend
#                            (default: <owner>/<repo>)
#   vars.PLATFORMS           target platforms
#                            (default: linux/amd64,linux/arm64)
#   secrets.REGISTRY_USERNAME  registry user     (default: the workflow actor)
#   secrets.REGISTRY_PASSWORD  registry password/token
#                              (default: GITHUB_TOKEN, which only works for ghcr.io)
#
# The job runs in the "release" environment, so you can add protection rules
# (required reviewers, tag restrictions) and environment-scoped secrets there.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  image:
    name: build and push image
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Only needed when pushing to ghcr.io with GITHUB_TOKEN.
      packages: write
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
      PLATFORMS: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest (pre-releases like
          # v1.3.0-rc1 only get their own tag).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=greylistd-frontend
            org.opencontainers.image.description=Web interface for greylistd

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  binaries:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }} binary
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install fpm
        run: sudo gem install --no-document fpm -v 1.18.0

      # v1.2.3 -> greylistd-frontend_1.2.3_linux_amd64.tar.gz and
      # greylistd-frontend_1.2.3-0_amd64.deb
      - name: Build tarball and Debian package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make dist deb VERSION="${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # Creates the release for the tag (marked as pre-release for tags like
      # v1.3.0-rc1), or replaces the files when the workflow is re-run.
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- *.tar.gz *.deb > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber -- *.tar.gz *.deb SHA256SUMS
          else
            prerelease=()
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              "${prerelease[@]}" -- *.tar.gz *.deb SHA256SUMS
          fi
          {
            echo "### Published binaries"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
