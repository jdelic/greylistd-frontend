version: "2"

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests use plain HTTP calls against httptest servers.
      - path: _test\.go
        linters:
          - noctx
          - gosec

formatters:
  enable:
    - gofmt
